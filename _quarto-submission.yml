project:
  type: default
  output-dir: _submission
  execute-dir: project
  render:
    - submission/manuscript.qmd

filters:
  - at: pre-ast
    path: title-page.lua
  - at: pre-quarto
    path: xref-hardcode.lua
  - at: post-quarto
    path: submission-split.lua

format:
  docx:
    toc: false
    reference-doc: submission/reference.docx
    fig-align: center
    fig-dpi: 300
