project:
  type: book
  output-dir: _book

book:
  title: 'Variation in Intraoperative Opioid Use for Adult and Paediatric Tonsillectomy: A Retrospective Electronic Patient Record Cohort Study'
  chapters:
    - index.qmd
    - abstract.qmd
    - manuscript.qmd
    - author_contributions.qmd
    - references.qmd
  appendices:
    - supplementary_tables_and_figures.qmd
    - supplementary_materials.qmd

format:
  html:
    theme: cosmo
    toc: true
    fig-align: center
    fig-dpi: 150
  pdf:
    documentclass: scrreprt
    toc: true
    fig-align: center
    fig-pos: H
    fig-dpi: 300
    output-file: tonsillectomy_manuscript.pdf
  docx:
    toc: true
    fig-align: center
    fig-dpi: 300
    output-file: tonsillectomy_manuscript
