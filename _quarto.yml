project:
  type: book
  output-dir: _book
  # Checks data/*.rds exist, clears the export/ dump, and re-runs the analysis scripts
  # when RUN_ANALYSIS=true (see pre_render.R and README.md)
  pre-render: pre_render.R

book:
  title: 'Intraoperative Opioid Choice in Adult and Paediatric Tonsillectomy: A Retrospective
    Electronic Patient Record Cohort Study'
  chapters:
    - index.qmd
    - manuscript.qmd
    - references.qmd
  appendices:
    - supplementary_tables_and_figures.qmd
    - supplementary_materials.qmd


bibliography: references.bib

# Supplementary chapter labels / headings
language:
  crossref-apx-prefix: 'Supplementary material'
  section-title-appendices: 'Supplementary material'

crossref:
  chapters: false
  custom:
    - kind: float
      key: sfig
      latex-env: sfig
      reference-prefix: Figure S
      caption-prefix: Figure S
      space-before-numbering: false
    - kind: float
      key: stbl
      latex-env: stbl
      reference-prefix: Table S
      caption-prefix: Table S
      space-before-numbering: false

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme: cosmo
    toc: true
    fig-align: center
    fig-dpi: 150
  pdf:
    documentclass: scrreprt
    toc: true
    fig-align: center
    fig-pos: H
    fig-dpi: 300
  docx:
    toc: true
    fig-align: center
    fig-dpi: 300
